{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cft.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cft.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cft.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
    {{- if .Values.networkPolicy.metricsIngress.from }}
    - Ingress
    {{- end }}
  {{- if .Values.networkPolicy.metricsIngress.from }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.metricsIngress.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
  {{- end }}
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.namespaceLabels | nindent 14 }}
          {{- with .Values.networkPolicy.dns.podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The Cloudflare edge, never a private address.
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.edge.cidr }}
            except:
              {{- toYaml .Values.networkPolicy.edge.except | nindent 14 }}
      ports:
        {{- toYaml .Values.networkPolicy.edge.ports | nindent 8 }}
    # The services the tunnel forwards to, and anything else, as raw NetworkPolicy egress rules.
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
