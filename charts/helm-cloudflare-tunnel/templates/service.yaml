{{- if or .Values.metrics.service.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cft.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cft.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "cft.selectorLabels" . | nindent 4 }}
{{- end }}
