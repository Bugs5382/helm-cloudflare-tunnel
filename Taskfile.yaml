version: '3'
vars:
  CHART_DIR: charts/helm-cloudflare-tunnel
tasks:
  default:
    cmds:
      - task: check
  lint:
    desc: Lint the chart (helm lint, strict) and the YAML files
    cmds:
      - |
        for f in {{.CHART_DIR}}/ci/*.yaml; do
          helm lint --strict {{.CHART_DIR}} -f "$f"
        done
      - yamllint .
  template:
    desc: Render the chart with the default CI values
    cmds:
      - helm template check {{.CHART_DIR}} -f {{.CHART_DIR}}/ci/default-values.yaml
  check:
    desc: Lint, render with every CI values file, and validate with kubeconform (same as CI)
    cmds:
      - ./scripts/check-chart.sh
      - yamllint .
  lint-init:
    desc: Install the tools the checks need
    cmds:
      - brew install helm kubeconform gitleaks yamllint actionlint
